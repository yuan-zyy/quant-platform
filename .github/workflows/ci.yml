name: Java and Python CI
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
        working-directory: python-sdk
      - name: Build the strategy sandbox test image
        id: sandbox
        run: |
          image=$(docker build --quiet -f quant-worker/sandbox/Dockerfile .)
          [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Verify Java, Python integration and sandbox isolation
        env:
          SANDBOX_IMAGE: ${{ steps.sandbox.outputs.image }}
          QUANT_HOST_SECRET: smoke-probe
        run: mvn -B -ntp -Dquant.python=python "-Dquant.sandbox.image=$SANDBOX_IMAGE" verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-console/package-lock.json
      - name: Build the Vue console
        working-directory: web-console
        run: |
          npm ci
          npm run build
      - name: Verify console client with the Java demo
        env:
          QUANT_DEMO_TOKEN: local-ci-console-test-token
          QUANT_CONSOLE_TEST_URL: http://127.0.0.1:8080
        run: |
          classpath=$(printf '%s/target/classes:' quant-server quant-backtest quant-domain quant-event quant-market quant-oms quant-portfolio)
          credentials=$(mktemp)
          fingerprint=$(printf '%s' "$QUANT_DEMO_TOKEN" | sha256sum | cut -d ' ' -f 1)
          printf '%s local-demo\n' "$fingerprint" > "$credentials"
          env -u QUANT_DEMO_TOKEN QUANT_DEMO_CREDENTIALS="$credentials" \
            java -cp "${classpath%:}" io.github.quant.server.demo.BacktestDemoServer &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -f -- "$credentials"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --output /dev/null --max-time 1 "$QUANT_CONSOLE_TEST_URL/health/ready"; then
              break
            fi
            [[ "$attempt" != 20 ]]
            sleep 1
          done
          curl --fail --silent --max-time 1 "$QUANT_CONSOLE_TEST_URL/health/live"
          npm --prefix web-console test
          node --test tools/load/backtest-load.test.mjs
          QUANT_LOAD_URL="$QUANT_CONSOLE_TEST_URL" QUANT_LOAD_JOBS=12 QUANT_LOAD_CONCURRENCY=4 node tools/load/backtest-load.mjs
  clickhouse:
    name: ClickHouse market data smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start temporary ClickHouse container
        run: |
          docker run --detach --name quant-clickhouse --publish 127.0.0.1::8123 \
            --env CLICKHOUSE_USER=quant_ci --env CLICKHOUSE_PASSWORD=quant_ci_password \
            clickhouse/clickhouse-server:26.8.36.3
      - name: Apply schema and verify publication history
        run: |
          binding=$(docker port quant-clickhouse 8123/tcp)
          [[ "$binding" =~ ^127\.0\.0\.1:[0-9]+$ ]]
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 5 --user quant_ci:quant_ci_password \
              --data 'SELECT 1' "http://$binding/"; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              exit 1
            fi
            sleep 2
          done
          docker exec -i quant-clickhouse clickhouse-client --user quant_ci --password quant_ci_password --multiquery < quant-market/src/main/resources/clickhouse/market_observations_v1.sql
          docker exec -i quant-clickhouse clickhouse-client --user quant_ci --password quant_ci_password --multiquery < quant-market/src/test/resources/clickhouse/market_observations_smoke.sql
          docker exec -i quant-clickhouse clickhouse-client --user quant_ci --password quant_ci_password --multiquery < quant-market/src/main/resources/clickhouse/market_import_batches_v1.sql
          docker exec -i quant-clickhouse clickhouse-client --user quant_ci --password quant_ci_password --multiquery < quant-market/src/main/resources/clickhouse/factor_import_batches_v1.sql
          docker exec -i quant-clickhouse clickhouse-client --user quant_ci --password quant_ci_password --multiquery < quant-market/src/main/resources/clickhouse/market_observations_view_v1.sql
          docker exec -i quant-clickhouse clickhouse-client --user quant_ci --password quant_ci_password --multiquery < quant-market/src/test/resources/clickhouse/market_observations_view_smoke.sql
      - name: Verify Java persistent import and replay
        env:
          QUANT_CLICKHOUSE_USER: quant_ci
          QUANT_CLICKHOUSE_PASSWORD: quant_ci_password
        run: |
          binding=$(docker port quant-clickhouse 8123/tcp)
          [[ "$binding" =~ ^127\.0\.0\.1:[0-9]+$ ]]
          mvn -B -ntp -pl quant-backtest -am "-Dquant.clickhouse.url=http://$binding/" verify
      - name: Collect ClickHouse logs on failure
        if: failure()
        run: docker logs --tail 100 quant-clickhouse
      - name: Remove temporary container and volumes
        if: always()
        run: docker rm --force --volumes quant-clickhouse
  postgres:
    name: PostgreSQL durable backtest integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quant_ci
          POSTGRES_USER: quant_ci
          POSTGRES_PASSWORD: quant_ci_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U quant_ci -d quant_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify durable task transactions and recovery
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports[5432] }}/quant_ci
          POSTGRES_TEST_USER: quant_ci
          POSTGRES_TEST_PASSWORD: quant_ci_password
        run: mvn -B -ntp -Ppostgres -pl quant-server -am "-Dquant.postgres.url=$POSTGRES_TEST_URL" verify
      - name: Restore a disposable backup and run recovered workers
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGRES_TEST_USER: quant_ci
          POSTGRES_TEST_PASSWORD: quant_ci_password
          PGUSER: quant_ci
          PGPASSWORD: quant_ci_password
        run: |
          bash tools/recovery/postgres-restore.sh "$POSTGRES_CONTAINER" bash -euc '
            mvn -B -ntp -Ppostgres -pl quant-server -am -Dtest=PostgresRestoreSmokeTest \
              -Dsurefire.failIfNoSpecifiedTests=false \
              "-Dquant.postgres.restore.url=jdbc:postgresql://127.0.0.1:$POSTGRES_PORT/$QUANT_RECOVERY_RESTORED_DB" test
          '
